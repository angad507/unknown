services:
  - type: web
    name: unknown-institution
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    disk:
      name: nomination-records
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SITE_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
